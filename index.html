    <script>
      // If uncompiled source file is served directly by GitHub Pages (raw main.tsx), redirect to /docs/
      window.addEventListener('DOMContentLoaded', function() {
        var isUncompiled = document.querySelector('script[src*="main.tsx"]');
        if (isUncompiled && window.location.hostname.endsWith('github.io')) {
          var p = window.location.pathname;
          if (!p.endsWith('/')) p += '/';
          if (!p.includes('/docs/')) {
            window.location.replace(p + 'docs/');
          }
        }
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
